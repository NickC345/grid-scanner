services:
  - type: web
    name: grid-scanner
    runtime: node
    # Free plan: sleeps when idle and scan history resets on each deploy.
    # To keep history, change plan to "starter" and uncomment the disk block + DATA_DIR.
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: DATAFORSEO_LOGIN
        sync: false
      - key: DATAFORSEO_PASSWORD
        sync: false
      - key: PAGESPEED_API_KEY
        sync: false
      # - key: DATA_DIR
      #   value: /var/data
    # disk:
    #   name: scans
    #   mountPath: /var/data
    #   sizeGB: 1
